<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Multi-model agent hub illustration">
  <rect width="1000" height="1000" fill="#101010"/>

  <g fill="#1a1a1a">
    <rect x="60" y="80" width="16" height="16"/>
    <rect x="924" y="120" width="16" height="16"/>
    <rect x="72" y="900" width="16" height="16"/>
    <rect x="912" y="880" width="16" height="16"/>
  </g>

  <!-- wiring from the hub out to every model -->
  <g stroke="#2a2a2a" stroke-width="6">
    <path d="M500 500L255 255M500 500L500 195M500 500L745 255"/>
    <path d="M500 500L255 745M500 500L500 805M500 500L745 745"/>
  </g>
  <g stroke="#e8b923" stroke-width="6">
    <path d="M500 500L300 500M500 500L700 500"/>
  </g>

  <!-- tool calls ticking along the wiring -->
  <g fill="#e8b923">
    <rect x="368" y="368" width="18" height="18"/>
    <rect x="614" y="368" width="18" height="18"/>
    <rect x="368" y="614" width="18" height="18"/>
    <rect x="614" y="614" width="18" height="18"/>
  </g>

  <!-- model nodes -->
  <g fill="#161616" stroke="#2a2a2a" stroke-width="4">
    <rect x="190" y="190" width="130" height="130" rx="24"/>
    <rect x="435" y="130" width="130" height="130" rx="24"/>
    <rect x="680" y="190" width="130" height="130" rx="24"/>
    <rect x="190" y="680" width="130" height="130" rx="24"/>
    <rect x="435" y="740" width="130" height="130" rx="24"/>
    <rect x="680" y="680" width="130" height="130" rx="24"/>
  </g>
  <g fill="#161616" stroke="#3a3118" stroke-width="4">
    <rect x="235" y="435" width="130" height="130" rx="24"/>
    <rect x="635" y="435" width="130" height="130" rx="24"/>
  </g>

  <!-- node glyphs -->
  <g fill="#2a2a2a">
    <rect x="233" y="233" width="44" height="34"/>
    <rect x="478" y="173" width="44" height="34"/>
    <rect x="723" y="233" width="44" height="34"/>
    <rect x="233" y="723" width="44" height="34"/>
    <rect x="723" y="723" width="44" height="34"/>
  </g>
  <g fill="#3a3118">
    <rect x="278" y="478" width="44" height="34"/>
    <rect x="678" y="478" width="44" height="34"/>
  </g>
  <rect x="478" y="783" width="44" height="34" fill="#e8b923"/>

  <!-- the orchestrating hub -->
  <rect x="415" y="415" width="170" height="170" rx="32" fill="#e8b923"/>
  <rect x="459" y="459" width="82" height="82" rx="12" fill="#101010"/>
  <path d="M480 500h40M500 480v40" stroke="#e8b923" stroke-width="8"/>
</svg>
