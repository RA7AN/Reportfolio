<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Slack export and archival illustration">
  <rect width="1000" height="1000" fill="#101010"/>

  <g fill="#1a1a1a">
    <rect x="60" y="80" width="16" height="16"/>
    <rect x="924" y="120" width="16" height="16"/>
    <rect x="72" y="900" width="16" height="16"/>
    <rect x="912" y="880" width="16" height="16"/>
  </g>

  <!-- the conversation being migrated -->
  <rect x="200" y="120" width="300" height="90" rx="24" fill="#1a1a1a"/>
  <rect x="236" y="218" width="96" height="24" rx="12" fill="#2a2a2a"/>

  <rect x="260" y="245" width="300" height="90" rx="24" fill="#2a2a2a"/>
  <rect x="536" y="343" width="96" height="24" rx="12" fill="#1a1a1a"/>

  <rect x="200" y="370" width="240" height="90" rx="24" fill="#1a1a1a"/>
  <rect x="230" y="468" width="96" height="24" rx="12" fill="#2a2a2a"/>

  <!-- the thread that carries the critical data -->
  <rect x="260" y="495" width="300" height="90" rx="24" fill="#3a3118"/>
  <rect x="266" y="501" width="288" height="78" rx="20" fill="none" stroke="#e8b923" stroke-width="4"/>

  <!-- attachment kept alongside the export -->
  <rect x="620" y="120" width="184" height="76" rx="16" fill="#161616" stroke="#2a2a2a" stroke-width="4"/>
  <rect x="648" y="146" width="24" height="24" fill="#e8b923"/>
  <rect x="688" y="151" width="90" height="14" rx="7" fill="#2a2a2a"/>

  <!-- export down into the archive -->
  <path d="M480 620v56" stroke="#e8b923" stroke-width="12"/>
  <path d="M424 660l56 56 56-56" fill="none" stroke="#e8b923" stroke-width="12" stroke-linecap="round"/>

  <!-- archive -->
  <rect x="200" y="720" width="600" height="160" rx="24" fill="#161616" stroke="#2a2a2a" stroke-width="4"/>
  <line x1="200" y1="786" x2="800" y2="786" stroke="#2a2a2a" stroke-width="4"/>
  <rect x="240" y="742" width="104" height="22" rx="11" fill="#2a2a2a"/>
  <circle cx="762" cy="753" r="12" fill="#e8b923"/>

  <g fill="#2a2a2a">
    <rect x="240" y="812" width="480" height="22" rx="6"/>
    <rect x="240" y="848" width="360" height="22" rx="6"/>
  </g>
  <rect x="640" y="848" width="140" height="22" rx="11" fill="#e8b923"/>
</svg>
