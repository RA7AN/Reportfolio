<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Multi-tenant agent platform illustration">
  <rect width="1000" height="1000" fill="#101010"/>

  <g fill="#1a1a1a">
    <rect x="60" y="80" width="16" height="16"/>
    <rect x="924" y="120" width="16" height="16"/>
    <rect x="72" y="900" width="16" height="16"/>
    <rect x="912" y="880" width="16" height="16"/>
  </g>

  <!-- the platform -->
  <rect x="140" y="140" width="720" height="720" rx="28" fill="#161616" stroke="#2a2a2a" stroke-width="4"/>
  <line x1="140" y1="212" x2="860" y2="212" stroke="#2a2a2a" stroke-width="4"/>
  <circle cx="188" cy="176" r="10" fill="#2a2a2a"/>
  <circle cx="224" cy="176" r="10" fill="#2a2a2a"/>
  <circle cx="260" cy="176" r="10" fill="#e8b923"/>

  <!-- envelope-encrypted secrets -->
  <rect x="786" y="174" width="48" height="26" rx="7" fill="#e8b923"/>
  <path d="M796 174v-10a14 14 0 0 1 28 0v10" fill="none" stroke="#e8b923" stroke-width="8"/>

  <!-- background job queue -->
  <rect x="140" y="212" width="170" height="648" fill="#1a1a1a"/>
  <g fill="#2a2a2a">
    <rect x="172" y="262" width="110" height="14" rx="7"/>
    <rect x="172" y="298" width="80" height="14" rx="7"/>
    <rect x="172" y="370" width="120" height="14" rx="7"/>
    <rect x="172" y="406" width="88" height="14" rx="7"/>
    <rect x="172" y="478" width="104" height="14" rx="7"/>
    <rect x="172" y="514" width="76" height="14" rx="7"/>
    <rect x="172" y="586" width="112" height="14" rx="7"/>
    <rect x="172" y="622" width="84" height="14" rx="7"/>
  </g>
  <rect x="172" y="334" width="124" height="14" rx="7" fill="#e8b923"/>
  <rect x="172" y="442" width="124" height="14" rx="7" fill="#3a3118"/>
  <rect x="172" y="550" width="124" height="14" rx="7" fill="#3a3118"/>
  <rect x="172" y="658" width="124" height="14" rx="7" fill="#3a3118"/>

  <!-- tenants on their own plans -->
  <g fill="#101010" stroke="#2a2a2a" stroke-width="4">
    <rect x="340" y="250" width="480" height="120" rx="20"/>
    <rect x="340" y="400" width="480" height="120" rx="20"/>
    <rect x="340" y="550" width="480" height="120" rx="20"/>
  </g>
  <g fill="#2a2a2a">
    <rect x="376" y="280" width="180" height="20" rx="4"/>
    <rect x="376" y="318" width="140" height="16" rx="8"/>
    <rect x="376" y="430" width="160" height="20" rx="4"/>
    <rect x="376" y="468" width="120" height="16" rx="8"/>
    <rect x="376" y="580" width="190" height="20" rx="4"/>
    <rect x="376" y="618" width="150" height="16" rx="8"/>
  </g>
  <g fill="#3a3118">
    <rect x="526" y="318" width="100" height="16" rx="8"/>
    <rect x="526" y="468" width="100" height="16" rx="8"/>
    <rect x="526" y="618" width="100" height="16" rx="8"/>
  </g>

  <!-- subscription state per agent -->
  <rect x="662" y="296" width="132" height="32" rx="16" fill="#e8b923"/>
  <rect x="662" y="446" width="132" height="32" rx="16" fill="#3a3118"/>
  <rect x="662" y="596" width="132" height="32" rx="16" fill="#3a3118"/>

  <!-- jobs moving in the background -->
  <rect x="340" y="700" width="480" height="100" rx="20" fill="#101010" stroke="#2a2a2a" stroke-width="4"/>
  <g fill="#2a2a2a">
    <rect x="376" y="730" width="200" height="16" rx="8"/>
    <rect x="376" y="758" width="150" height="16" rx="8"/>
  </g>
  <circle cx="760" cy="750" r="26" fill="#e8b923"/>
</svg>
