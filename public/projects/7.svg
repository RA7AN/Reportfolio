<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Construction safety inspection illustration">
  <rect width="1000" height="1000" fill="#101010"/>

  <g fill="#1a1a1a">
    <rect x="60" y="80" width="16" height="16"/>
    <rect x="924" y="120" width="16" height="16"/>
    <rect x="72" y="900" width="16" height="16"/>
    <rect x="912" y="880" width="16" height="16"/>
  </g>

  <!-- the site photo -->
  <rect x="150" y="130" width="700" height="430" rx="24" fill="#161616" stroke="#2a2a2a" stroke-width="4"/>
  <path d="M150 500h700v10a24 24 0 0 1-24 24H174a24 24 0 0 1-24-24z" fill="#1a1a1a"/>
  <line x1="150" y1="500" x2="850" y2="500" stroke="#2a2a2a" stroke-width="4"/>

  <!-- crane -->
  <rect x="660" y="210" width="20" height="290" fill="#2a2a2a"/>
  <rect x="480" y="210" width="280" height="18" fill="#2a2a2a"/>
  <rect x="540" y="228" width="8" height="96" fill="#2a2a2a"/>
  <rect x="522" y="324" width="44" height="34" rx="4" fill="#3a3118"/>

  <!-- worker -->
  <path d="M300 386a42 42 0 0 1 84 0z" fill="#e8b923"/>
  <rect x="286" y="386" width="112" height="14" rx="7" fill="#e8b923"/>
  <rect x="314" y="400" width="56" height="100" rx="10" fill="#2a2a2a"/>
  <rect x="320" y="500" width="18" height="56" fill="#2a2a2a"/>
  <rect x="348" y="500" width="18" height="56" fill="#2a2a2a"/>

  <!-- what the model found -->
  <rect x="268" y="326" width="172" height="228" rx="8" fill="none" stroke="#e8b923" stroke-width="4"/>
  <rect x="470" y="190" width="310" height="160" rx="8" fill="none" stroke="#3a3118" stroke-width="4"/>
  <rect x="268" y="292" width="124" height="26" rx="13" fill="#e8b923"/>
  <rect x="470" y="156" width="136" height="26" rx="13" fill="#3a3118"/>

  <!-- findings grounded in the standards -->
  <rect x="150" y="620" width="700" height="260" rx="24" fill="#161616" stroke="#2a2a2a" stroke-width="4"/>
  <g>
    <rect x="190" y="664" width="28" height="28" rx="6" fill="#e8b923"/>
    <rect x="190" y="716" width="28" height="28" rx="6" fill="#e8b923"/>
    <rect x="190" y="768" width="28" height="28" rx="6" fill="#e8b923"/>
    <rect x="190" y="820" width="28" height="28" rx="6" fill="#3a3118"/>
  </g>
  <g fill="#2a2a2a">
    <rect x="240" y="670" width="300" height="16" rx="8"/>
    <rect x="240" y="722" width="248" height="16" rx="8"/>
    <rect x="240" y="774" width="284" height="16" rx="8"/>
    <rect x="240" y="826" width="212" height="16" rx="8"/>
  </g>
  <rect x="580" y="670" width="230" height="16" rx="8" fill="#3a3118"/>
  <rect x="580" y="722" width="180" height="16" rx="8" fill="#3a3118"/>

  <!-- review then export -->
  <rect x="580" y="820" width="230" height="34" rx="17" fill="#e8b923"/>
  <rect x="642" y="832" width="106" height="10" rx="5" fill="#101010"/>
