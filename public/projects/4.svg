<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Video temporal grounding illustration">
  <rect width="1000" height="1000" fill="#101010"/>

  <g fill="#1a1a1a">
    <rect x="60" y="80" width="16" height="16"/>
    <rect x="924" y="120" width="16" height="16"/>
    <rect x="72" y="900" width="16" height="16"/>
    <rect x="912" y="880" width="16" height="16"/>
  </g>

  <!-- the footage -->
  <rect x="180" y="120" width="640" height="380" rx="24" fill="#161616" stroke="#2a2a2a" stroke-width="4"/>
  <path d="M460 258l92 52-92 52z" fill="#e8b923"/>
  <rect x="216" y="432" width="568" height="20" rx="10" fill="#1a1a1a"/>
  <rect x="216" y="432" width="320" height="20" rx="10" fill="#3a3118"/>

  <!-- the query -->
  <rect x="180" y="540" width="420" height="96" rx="20" fill="#1a1a1a"/>
  <rect x="216" y="572" width="240" height="18" rx="4" fill="#2a2a2a"/>
  <rect x="216" y="602" width="150" height="18" rx="4" fill="#3a3118"/>

  <!-- the query resolves to a moment on the timeline -->
  <path d="M660 588h96" stroke="#2a2a2a" stroke-width="6"/>
  <path d="M756 588v28" stroke="#e8b923" stroke-width="6"/>

  <!-- timeline -->
  <rect x="180" y="684" width="640" height="46" rx="12" fill="#1a1a1a"/>
  <g stroke="#2a2a2a" stroke-width="4">
    <path d="M300 684v46M420 684v46M540 684v46M660 684v46"/>
  </g>
  <rect x="400" y="684" width="180" height="46" fill="#e8b923"/>
  <g stroke="#e8b923" stroke-width="6" fill="none">
    <path d="M392 676v-26M392 668h26M588 676v-26M588 668h-26"/>
  </g>

  <!-- frames around the grounded moment -->
  <g fill="#161616" stroke="#2a2a2a" stroke-width="4">
    <rect x="180" y="772" width="140" height="128" rx="12"/>
    <rect x="510" y="772" width="140" height="128" rx="12"/>
    <rect x="680" y="772" width="140" height="128" rx="12"/>
  </g>
  <g fill="#2a2a2a">
    <rect x="208" y="820" width="84" height="32" rx="6"/>
    <rect x="538" y="820" width="84" height="32" rx="6"/>
    <rect x="708" y="820" width="84" height="32" rx="6"/>
  </g>
  <rect x="345" y="772" width="140" height="128" rx="12" fill="#3a3118" stroke="#e8b923" stroke-width="4"/>
  <rect x="373" y="820" width="84" height="32" rx="6" fill="#e8b923"/>
</svg>
